<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Tinkerbot Apps UI Kit</title>
    <link rel="stylesheet" href="/component-library-preview.css" />
    <style>
      html,body{min-height:100%;margin:0;background:#fff;color:#333;font-family:"SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:64px}main{max-width:1152px;margin:0 auto}.kit-header{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;border-bottom:2px solid #e0e0e0;padding-bottom:24px;margin-bottom:40px}.kit-header p{margin:0;color:#757575;font-size:13px;line-height:22px}.kit-header h1{margin:0;font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:35px;line-height:42px;font-weight:600}@media(max-width:640px){body{padding:24px}.kit-header{align-items:flex-start;flex-direction:column}}
    </style>
    <style>.kit-header,.kit-header h1,.kit-header p{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
  </head>
  <body>
    <main>
      <header class="kit-header"><div><p>UI KIT / REACT LIBRARY</p><h1>Tinkerbot Apps UI</h1></div><p>Figma-derived primitives · 8px grid · light system</p></header>
      <div id="react-component-library"></div>
    </main>
    <script type="module" src="/component-library-preview.js"></script>
  </body>
</html>
